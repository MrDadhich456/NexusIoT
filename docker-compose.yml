services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nexusiot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Apache Kafka Cluster (KRaft mode — no ZooKeeper required)
  # 3 brokers with replication-factor=3 for production-grade durability.
  # Using the official apache/kafka image.
  # ──────────────────────────────────────────────────────────────────────
  kafka-1:
    image: apache/kafka:latest
    container_name: nexusiot-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: NexusIoT-Kafka-Cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    ports:
      - "19094:9094"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-2:
    image: apache/kafka:latest
    container_name: nexusiot-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: NexusIoT-Kafka-Cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    ports:
      - "29094:9094"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-3:
    image: apache/kafka:latest
    container_name: nexusiot-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: NexusIoT-Kafka-Cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    ports:
      - "39094:9094"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Kafka UI — Web dashboard for topic/partition/message inspection
  # Access at http://localhost:8080
  # ──────────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexusiot-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexusiot
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # MQTT → Kafka Bridge — Forwards all sensor telemetry into Kafka
  # ──────────────────────────────────────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: nexusiot-bridge
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: raw-telemetry
    depends_on:
      mosquitto:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # TimescaleDB — Time-series database (PostgreSQL + hypertables)
  # Stores all telemetry readings and anomaly events permanently.
  # schema.sql auto-runs on first boot via docker-entrypoint-initdb.d.
  # ──────────────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: nexusiot-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexusiot
      POSTGRES_PASSWORD: nexusiot
      POSTGRES_DB: nexusiot
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusiot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Stream Processor — Consumes raw-telemetry, validates, detects anomalies
  # Produces anomaly alerts to anomaly-events topic
  # Exposes Prometheus metrics on port 8001
  # ──────────────────────────────────────────────────────────────────────
  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: nexusiot-processor
    ports:
      - "8001:8001"
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INPUT_TOPIC: raw-telemetry
      OUTPUT_TOPIC: anomaly-events
      CONSUMER_GROUP: stream-processor
      METRICS_PORT: "8001"
      TIMESCALE_DSN: postgresql://nexusiot:nexusiot@timescaledb:5432/nexusiot
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # FastAPI API Gateway — REST + WebSocket endpoints
  # REST: queries TimescaleDB for historical telemetry and anomaly data
  # WebSocket: consumes Kafka topics and fans out to browser clients
  # Access API docs at http://localhost:8000/docs
  # ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexusiot-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nexusiot:nexusiot@timescaledb:5432/nexusiot
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      INPUT_TOPIC: raw-telemetry
      OUTPUT_TOPIC: anomaly-events
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Prometheus — Time-series metrics scraper
  # Scrapes API gateway and stream processor metrics
  # Access at http://localhost:9090
  # ──────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nexusiot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Grafana — Metrics dashboards
  # Auto-provisioned with Prometheus datasource and NexusIoT dashboard
  # Access at http://localhost:3000
  # ──────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nexusiot-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  timescale_data:
  grafana_data:
