# ============================================================================
# NexusIoT — Database Secrets
# ============================================================================
# Stores sensitive credentials separately from ConfigMap.
# Values are base64-encoded (NOT encrypted — use Sealed Secrets or
# External Secrets Operator in production).
#
# To regenerate a value:  echo -n "your-value" | base64
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: nexusiot-db-secrets
  namespace: nexusiot
  labels:
    app.kubernetes.io/part-of: nexusiot
type: Opaque
data:
  # --- Individual DB credentials ---
  POSTGRES_USER: bmV4dXNpb3Q=           # echo -n "nexusiot" | base64
  POSTGRES_PASSWORD: bmV4dXNpb3Q=       # echo -n "nexusiot" | base64
  POSTGRES_DB: bmV4dXNpb3Q=             # echo -n "nexusiot" | base64

  # --- Full connection strings (used by Processor and API) ---
  # postgresql://nexusiot:nexusiot@timescaledb.nexusiot.svc.cluster.local:5432/nexusiot
  TIMESCALE_DSN: cG9zdGdyZXNxbDovL25leHVzaW90Om5leHVzaW90QHRpbWVzY2FsZWRiLm5leHVzaW90LnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvbmV4dXNpb3Q=
  DATABASE_URL: cG9zdGdyZXNxbDovL25leHVzaW90Om5leHVzaW90QHRpbWVzY2FsZWRiLm5leHVzaW90LnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvbmV4dXNpb3Q=
