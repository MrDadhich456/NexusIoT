# ============================================================================
# NexusIoT — API Gateway Service
# ============================================================================
# ClusterIP service exposes FastAPI on port 8000 inside the cluster.
# DNS name: api.nexusiot.svc.cluster.local
# Load-balances across 2 API replicas.
# The Ingress controller routes external HTTP traffic to this service.
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nexusiot
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: nexusiot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api            # Routes to both API Deployment replicas
  ports:
    - name: http
      port: 8000                           # Service port
      targetPort: 8000                     # Container port
