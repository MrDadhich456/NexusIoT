# Copy to secrets.yaml and replace each placeholder with a base64-encoded value.
# Kubernetes Secrets are base64-encoded, not encrypted; do not commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: nexusiot-db-secrets
  namespace: nexusiot
  labels:
    app.kubernetes.io/part-of: nexusiot
type: Opaque
data:
  POSTGRES_USER: <base64-encoded-postgres-user>
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>
  POSTGRES_DB: <base64-encoded-postgres-database>
  TIMESCALE_DSN: <base64-encoded-timescale-dsn>
  DATABASE_URL: <base64-encoded-database-url>
